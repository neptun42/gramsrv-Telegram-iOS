# Копия для репозитория iamxvbaba/gramsrv-Telegram-iOS
# Целевой путь в репо: .github/workflows/build.yml (заменить существующий)
# Что чинит относительно старого: macos-13 -> macos-26 (нужен Xcode 26.2
# из versions.json), checkout@v2 -> v4, убраны удаленные
# actions/create-release@v1 и upload-release-asset@v1, артефакт
# переименован Telegram.ipa -> LunaGram.ipa. Подпись та же фейковая
# (build-system/fake-codesigning) — .ipa без подписи, ставится через
# Sideloadly / AltStore / TrollStore со своей подписью.
name: LunaGram iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (empty = auto from git count + offset)'
        required: false
        default: ''
  push:
    branches: [master]
    paths: ['.github/workflows/build.yml']

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fix relative submodule URLs
        run: |
          # .gitmodules uses ../tgcalls.git and ../rlottie.git which resolve to
          # nonexistent neptun42/* in the fork. Point them at upstream until
          # custom forks exist.
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: Select Xcode from versions.json
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: $XCODE_VERSION"
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer
          xcodebuild -version

      - name: Canonical source dir
        run: |
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        run: |
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            OFFSET=$(cat build_number_offset)
            COUNT=$(git rev-list --count HEAD)
            BUILD_NUMBER=$((COUNT + OFFSET))
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_containerhost \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          cp bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa build/artifacts/LunaGram.ipa
          ls -la build/artifacts/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaGram-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/LunaGram.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lunagram-${{ env.BUILD_NUMBER }}
          name: LunaGram iOS (${{ env.BUILD_NUMBER }})
          body: Unsigned LunaGram iOS build (fake codesigning). Sideload with Sideloadly / AltStore / TrollStore.
          files: /Users/Shared/telegram-ios/build/artifacts/LunaGram.ipa
